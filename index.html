<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>SkyBlock</title>
<style>
@font-face { font-family: "MC"; src: url("assets/minecraft.ttf") format("truetype"); font-display: block; }

:root {
  --p: 2px;   /* GUI-Pixel */
  --sp: 1.5px; /* Scoreboard-Pixel */
  --S: 200px; /* Blockgröße */
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: #000; overflow: hidden; }
body {
  font-family: "MC", monospace; color: #fff;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
  -webkit-font-smoothing: none; font-smooth: never;
}
img, .px { image-rendering: pixelated; image-rendering: crisp-edges; }

/* ---------- Text im Minecraft-Stil ---------- */
.t { --tp: var(--p); font-size: calc(8 * var(--tp)); line-height: calc(9 * var(--tp)); white-space: pre-wrap; word-break: break-word; }
.t span { text-shadow: var(--tp) var(--tp) 0 var(--sh); }
.t span.b { text-shadow: var(--tp) 0 0 currentColor, var(--tp) var(--tp) 0 var(--sh), calc(2 * var(--tp)) var(--tp) 0 var(--sh); letter-spacing: var(--tp); }
.t span.i { font-style: italic; }
.t span.s { text-decoration: line-through; text-decoration-thickness: var(--tp); }

.screen { position: fixed; inset: 0; display: none; }
.screen.on { display: block; }

/* ---------- Login ---------- */
.dirt {
  background:
    linear-gradient(rgba(0,0,0,.72), rgba(0,0,0,.72)),
    url("assets/tex/block/dirt.png") 0 0 / calc(32 * var(--p)) calc(32 * var(--p));
  image-rendering: pixelated;
}
.mitte { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(6 * var(--p)); padding: 16px; text-align: center; }
.feld {
  width: min(100%, calc(200 * var(--p))); height: calc(20 * var(--p));
  background: #000; color: #e0e0e0; outline: none;
  border: var(--p) solid #a0a0a0;
  font-family: "MC", monospace; font-size: calc(8 * var(--p)); padding: 0 calc(4 * var(--p));
  user-select: text; -webkit-user-select: text;
}
.feld:focus { border-color: #fff; }
.knopf {
  width: min(100%, calc(200 * var(--p))); height: calc(20 * var(--p));
  border: calc(3 * var(--p)) solid transparent;
  border-image: url("assets/tex/gui/button.png") 3 fill / calc(3 * var(--p)) stretch;
  image-rendering: pixelated;
  background: none; color: #fff; cursor: pointer;
  font-family: "MC", monospace; font-size: calc(8 * var(--p)); line-height: 1;
  text-shadow: var(--p) var(--p) 0 #3f3f3f;
}
.knopf:hover, .knopf:focus-visible, .knopf:active { border-image-source: url("assets/tex/gui/button_highlighted.png"); outline: none; }
.knopf.klein { width: auto; padding: 0 calc(8 * var(--p)); }
.links { width: min(100%, calc(200 * var(--p))); text-align: left; }
#kopf { width: calc(32 * var(--p)); height: calc(32 * var(--p)); display: none; }
.lade { width: min(100%, calc(200 * var(--p))); height: calc(2 * var(--p)); background: #333; }
.lade > div { height: 100%; width: 0; background: #80ff20; transition: width .4s; }

/* ---------- Spiel ---------- */
#spiel {
  background:
    radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 55%, rgba(0,0,0,.92) 100%),
    linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)),
    url("assets/tex/block/deepslate.png") 0 0 / calc(48 * var(--p)) calc(48 * var(--p));
  image-rendering: pixelated;
}
#buehne { position: absolute; inset: 0; touch-action: none; cursor: pointer; }
.szene { position: absolute; left: 50%; top: 40%; width: var(--S); height: var(--S); margin: calc(var(--S) / -2) 0 0 calc(var(--S) / -2); perspective: calc(var(--S) * 5); }
.schwebe { width: 100%; height: 100%; transform-style: preserve-3d; animation: schweben 3s ease-in-out infinite; }
@keyframes schweben { 50% { transform: translateY(calc(var(--S) * -0.04)); } }
.wuerfel {
  position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
  transform: rotateX(-28deg) rotateY(-38deg); transition: transform .07s;
}
.wuerfel.treffer { transform: rotateX(-28deg) rotateY(-38deg) scale3d(.92,.92,.92); }
.wuerfel.weg { transform: rotateX(-28deg) rotateY(-38deg) scale3d(0,0,0); transition: transform .12s ease-in; }
.wuerfel.neu { animation: neu .28s cubic-bezier(.2,1.6,.5,1); }
@keyframes neu { from { transform: rotateX(-28deg) rotateY(-38deg) scale3d(0,0,0); } }
.seite { position: absolute; inset: 0; background-size: 100% 100%; image-rendering: pixelated; backface-visibility: hidden; }
.seite img { position: absolute; inset: 0; width: 100%; height: 100%; display: none; mix-blend-mode: multiply; opacity: .9; }
.vorne  { transform: translateZ(calc(var(--S) / 2)); filter: brightness(.8); }
.hinten { transform: rotateY(180deg) translateZ(calc(var(--S) / 2)); filter: brightness(.8); }
.rechts { transform: rotateY(90deg) translateZ(calc(var(--S) / 2)); filter: brightness(.6); }
.links3 { transform: rotateY(-90deg) translateZ(calc(var(--S) / 2)); filter: brightness(.6); }
.oben   { transform: rotateX(90deg) translateZ(calc(var(--S) / 2)); }
.unten  { transform: rotateX(-90deg) translateZ(calc(var(--S) / 2)); filter: brightness(.5); }
#tipp { position: absolute; left: 0; right: 0; top: calc(40% + var(--S) * .75); text-align: center; animation: blink 1.4s ease-in-out infinite; pointer-events: none; }
@keyframes blink { 50% { opacity: .35; } }

#hand {
  position: absolute; right: -4%; bottom: calc(60 * var(--p)); width: min(42vw, 260px); aspect-ratio: 1;
  background: center / contain no-repeat; image-rendering: pixelated;
  transform-origin: 85% 95%; transform: rotate(-12deg); pointer-events: none; opacity: .95;
}
#hand.blockhand { transform: rotate(0deg) scale(.55); transform-origin: 70% 90%; }
#hand.schlag { animation: schlag .2s ease-out; }
@keyframes schlag { 40% { transform: rotate(-58deg) translate(-12%, -6%); } }

/* Scoreboard */
#board {
  --tp: var(--sp); position: absolute; right: 6px; top: max(8px, env(safe-area-inset-top)); min-width: calc(110 * var(--sp));
  pointer-events: none;
}
#board > div { background: rgba(0,0,0,.3); padding: 0 calc(2 * var(--sp)); }
#board > div:first-child { background: rgba(0,0,0,.4); text-align: center; }

/* Chat */
#chat {
  --tp: calc(var(--p) * .75); position: absolute; left: 4px; bottom: calc(66 * var(--p)); width: min(calc(100% - 8px), calc(320 * var(--p)));
  display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none;
}
#chat > div { background: rgba(0,0,0,.5); padding: 0 calc(1 * var(--p)); transition: opacity 1s; }
#chat > div.alt { opacity: 0; }

/* Titel */
#titel { position: absolute; left: 0; right: 0; top: 25%; text-align: center; pointer-events: none; opacity: 0; transition: opacity .5s; }
#titel.on { opacity: 1; }
#titel .gross { --tp: calc(var(--p) * 1.5); }
#titel .sub { --tp: var(--p); margin-top: calc(4 * var(--p)); }

/* HUD unten */
#hud { position: absolute; left: 50%; bottom: max(6px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: calc(182 * var(--p)); }
#aktion { --tp: calc(var(--p) * .75); text-align: center; margin-bottom: calc(5 * var(--p)); white-space: nowrap; }
.reihe { display: flex; justify-content: space-between; height: calc(9 * var(--p)); margin-bottom: calc(1 * var(--p)); }
.reihe > div { display: flex; }
.reihe .icon { width: calc(9 * var(--p)); height: calc(9 * var(--p)); margin-right: calc(-1 * var(--p)); position: relative; }
.reihe .icon img { position: absolute; inset: 0; width: 100%; height: 100%; }
.reihe .rechtsbuendig { flex-direction: row-reverse; }
.reihe .rechtsbuendig .icon { margin-right: 0; margin-left: calc(-1 * var(--p)); }
#xp { position: relative; height: calc(5 * var(--p)); background: url("assets/tex/gui/xp_bg.png") 0 0 / 100% 100%; image-rendering: pixelated; margin-bottom: calc(1 * var(--p)); }
#xpfill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: url("assets/tex/gui/xp_progress.png") 0 0 / calc(182 * var(--p)) 100%; image-rendering: pixelated; }
#level { position: absolute; left: 0; right: 0; bottom: calc(1 * var(--p)); text-align: center; color: #80ff20; display: none;
  text-shadow: var(--p) 0 0 #000, calc(-1 * var(--p)) 0 0 #000, 0 var(--p) 0 #000, 0 calc(-1 * var(--p)) 0 #000; }
#hotbar { position: relative; width: calc(182 * var(--p)); height: calc(22 * var(--p)); background: url("assets/tex/gui/hotbar.png") 0 0 / 100% 100%; image-rendering: pixelated; }
#auswahl { position: absolute; top: calc(-1 * var(--p)); width: calc(24 * var(--p)); height: calc(23 * var(--p)); pointer-events: none; transition: left .1s; }
.slot { position: absolute; top: calc(3 * var(--p)); width: calc(16 * var(--p)); height: calc(16 * var(--p)); cursor: pointer; }
.slot .item, .islot .item { position: absolute; inset: 0; }
.slot .anzahl, .islot .anzahl { position: absolute; right: calc(-1 * var(--p)); bottom: calc(-2 * var(--p)); pointer-events: none; }
.slot.hupf .item { animation: hupf .25s; }
@keyframes hupf { 40% { transform: scale(1.3); } }

/* Items + Verzauberungsglanz */
.item { background-size: 100% 100%; image-rendering: pixelated; }
.item.ench::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  -webkit-mask: var(--m) 0 0 / 100% 100% no-repeat; mask: var(--m) 0 0 / 100% 100% no-repeat;
  background: linear-gradient(120deg, transparent 0 25%, rgba(190,90,255,.6) 38%, transparent 52%, transparent 70%, rgba(190,90,255,.5) 82%, transparent 95%);
  background-size: 300% 300%; animation: glanz 2.6s linear infinite; mix-blend-mode: screen;
}
@keyframes glanz { from { background-position: 100% 100%; } to { background-position: 0 0; } }

/* Tooltip */
.tooltip {
  --tp: var(--p);
  position: fixed; z-index: 30; max-width: min(calc(100vw - 12px), calc(220 * var(--p)));
  background: rgba(16,0,16,.94); padding: calc(3 * var(--p)) calc(4 * var(--p));
  border: var(--p) solid; border-image: linear-gradient(rgba(80,0,255,.4), rgba(40,0,127,.4)) 1;
  outline: var(--p) solid rgba(16,0,16,.94);
  pointer-events: none; display: none;
}
.tooltip .erste { margin-bottom: calc(2 * var(--p)); }

/* Effekte */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
#fx .teil { position: absolute; image-rendering: pixelated; }
#fx .flug { position: absolute; }
#feuerwerk { position: fixed; inset: 0; pointer-events: none; z-index: 25; width: 100%; height: 100%; }

/* Geschenk-Anzeige */
#enthuellung { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 12px; overflow-y: auto; }
#enthuellung.on { display: flex; }
#enthuellung .tooltip { position: relative; display: block; pointer-events: auto; max-width: min(100%, calc(230 * var(--p))); animation: auf .35s cubic-bezier(.2,1.5,.5,1); }
@keyframes auf { from { transform: scale(.4); opacity: 0; } }
.karte {
  margin: calc(4 * var(--p)) auto calc(6 * var(--p)); width: calc(120 * var(--p)); aspect-ratio: 1.586; border-radius: calc(5 * var(--p));
  background: linear-gradient(135deg, #0070d1 0%, #003791 55%, #00205b 100%);
  box-shadow: 0 0 0 var(--p) rgba(255,255,255,.25) inset, 0 calc(3 * var(--p)) 0 rgba(0,0,0,.5);
  position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: calc(6 * var(--p));
}
.karte::before { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.25) 45%, transparent 60%); background-size: 300% 100%; animation: glanz 3s linear infinite; }
.karte .wert { --tp: calc(var(--p) * 2.5); align-self: flex-end; }
.codebox {
  margin: calc(2 * var(--p)) 0 calc(3 * var(--p)); padding: calc(4 * var(--p)); text-align: center;
  background: #000; border: var(--p) solid #a0a0a0; user-select: all; -webkit-user-select: all; word-break: break-all;
}
.codebox span { letter-spacing: calc(var(--p) * 1); }
.knopfreihe { display: flex; gap: calc(4 * var(--p)); margin-top: calc(6 * var(--p)); }
.knopfreihe .knopf { flex: 1; }

/* Name des gewählten Items über der Hotbar */
#itemname { position: absolute; left: -50%; right: -50%; bottom: 100%; margin-bottom: calc(2 * var(--p)); text-align: center; opacity: 0; transition: opacity .4s; pointer-events: none; }
#itemname.on { opacity: 1; transition: none; }

/* Inventar */
#inventar { position: fixed; inset: 0; z-index: 35; background: rgba(16,16,16,.78); display: none; flex-direction: column; align-items: center; justify-content: center; gap: calc(6 * var(--p)); }
#inventar.on { display: flex; }
#invgui { position: relative; width: calc(176 * var(--p)); height: calc(166 * var(--p)); background: url("assets/tex/gui/inventory.png") 0 0 / calc(256 * var(--p)) calc(256 * var(--p)); image-rendering: pixelated; }
#invgui .titel { position: absolute; left: calc(97 * var(--p)); top: calc(6 * var(--p)); color: #404040; }
#invkoerper { position: absolute; left: calc(26 * var(--p)); top: calc(10 * var(--p)); width: calc(49 * var(--p)); height: calc(66 * var(--p)); object-fit: contain; }
.islot { position: absolute; width: calc(16 * var(--p)); height: calc(16 * var(--p)); cursor: pointer; }
.islot .leer { position: absolute; inset: 0; width: 100%; height: 100%; }
.islot::before { content: ""; position: absolute; inset: 0; }
.islot:hover::before { background: rgba(255,255,255,.45); }
.islot.gewaehlt::before { background: rgba(255,255,140,.6); box-shadow: 0 0 0 var(--p) #ffff55; }
.tooltip { z-index: 50; }
</style>
</head>
<body>

<!-- Anmeldung -->
<div id="anmeldung" class="screen on dirt">
  <div class="mitte">
    <div class="t" style="--tp: calc(var(--p) * 2)" data-mc="§6§lHYPIXEL §e§lSKYBLOCK"></div>

<!-- Spiel -->
<div id="spiel" class="screen">
  <div id="buehne">
    <div class="szene"><div class="schwebe">
      <div id="wuerfel" class="wuerfel">
        <div class="seite vorne"><img alt=""></div>
        <div class="seite hinten"><img alt=""></div>
        <div class="seite rechts"><img alt=""></div>

    </div></div>

  <div id="hand"></div>

<script src="secret.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const warte = (ms) => new Promise((r) => setTimeout(r, ms));
const zufall = (a, b) => a + Math.random() * (b - a);

// ---------- Minecraft-Farbcodes ----------
const FARBEN = { 0:"#000000",1:"#0000AA",2:"#00AA00",3:"#00AAAA",4:"#AA0000",5:"#AA00AA",6:"#FFAA00",7:"#AAAAAA",8:"#555555",9:"#5555FF",a:"#55FF55",b:"#55FFFF",c:"#FF5555",d:"#FF55FF",e:"#FFFF55",f:"#FFFFFF" };
function schatten(hex) {
  const n = parseInt(hex.slice(1), 16);
  const k = (v) => Math.floor(v / 4).toString(16).padStart(2, "0");
  return "#" + k(n >> 16) + k((n >> 8) & 255) + k(n & 255);
}
function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
function mc(text, start = "f") {
  let farbe = start, fett = false, kursiv = false, durch = false, html = "", puffer = "";
  const raus = () => {
    if (!puffer) return;
    const c = FARBEN[farbe];
    const kl = [fett && "b", kursiv && "i", durch && "s"].filter(Boolean).join(" ");
    html += `<span class="${kl}" style="color:${c};--sh:${schatten(c)}">${esc(puffer)}</span>`;
    puffer = "";
  };
  for (let i = 0; i < text.length; i++) {
    if (text[i] === "§" && i + 1 < text.length) {
      raus();
      const k = text[++i].toLowerCase();
      if (k in FARBEN) { farbe = k; fett = kursiv = durch = false; }
      else if (k === "l") fett = true;
      else if (k === "o") kursiv = true;
      else if (k === "m") durch = true;
      else if (k === "r") { farbe = start; fett = kursiv = durch = false; }
    } else puffer += text[i];
  }
  raus();
  return html;
}
document.querySelectorAll("[data-mc]").forEach((el) => (el.innerHTML = mc(el.dataset.mc)));

// ---------- Größen ----------
function groessen() {
  const w = window.innerWidth, h = window.innerHeight;
  const p = Math.max(1, Math.min(3, Math.floor((w - 12) / 182), Math.floor(h / 260)));
  const r = document.documentElement.style;
  r.setProperty("--p", p + "px");
  r.setProperty("--sp", (p >= 3 ? 2 : p * 0.75) + "px");
  r.setProperty("--S", Math.round(Math.min(w * 0.5, h * 0.3, 280)) + "px");
}
groessen();
addEventListener("resize", groessen);

// ---------- Sound ----------
const SOUNDS = ["dig1","dig2","dig3","dig4","cloth1","orb","levelup","pop","click","chestopen","pling","launch","blast","twinkle"];
let audio = null;
const puffer = {};
function audioStart() {
  if (audio) { audio.resume(); return; }
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; }
  for (const s of SOUNDS) {
    fetch(`assets/snd/${s}.ogg`).then((r) => r.arrayBuffer()).then((b) => audio.decodeAudioData(b)).then((d) => (puffer[s] = d)).catch(() => {});
  }
}
function ton(name, vol = 1, rate = 1) {
  if (!audio || !puffer[name]) return;
  const q = audio.createBufferSource();
  const g = audio.createGain();
  q.buffer = puffer[name]; q.playbackRate.value = rate; g.gain.value = vol;
  q.connect(g).connect(audio.destination); q.start();
}
const vibrieren = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

// ---------- Verschlüsselung ----------
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function entschluesseln(name) {
  const G = window.GESCHENK, enc = new TextEncoder();
  const basis = await crypto.subtle.importKey("raw", enc.encode(name.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(G.salt), iterations: G.iter, hash: "SHA-256" }, basis, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const klar = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(G.iv) }, key, b64(G.ct));
  return JSON.parse(new TextDecoder().decode(klar));
}

// ---------- Items ----------
const T = "assets/tex/";
const ITEMS = {
  pick: { bild: T + "item/golden_pickaxe.png", ench: true, name: "§6Geburtstags-Stonk", lore: [

// ---------- Partikel ----------
const fx = $("#fx");
const teile = [];
function wuerfelMitte() {
  const r = $(".szene").getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2, g: r.width };
}
function partikel(anzahl, kraft) {
  const m = wuerfelMitte();
  const tx = m.g / 16;
  for (let i = 0; i < anzahl; i++) {
    const el = document.createElement("div");
    el.className = "teil";
    const groesse = tx * zufall(.6, 1.2);
    el.style.width = el.style.height = groesse + "px";
    el.style.backgroundImage = `url(${zustand.texturAktuell})`;
    el.style.backgroundSize = `${tx * 8}px ${tx * 8}px`;
    el.style.backgroundPosition = `${-Math.floor(Math.random() * 14) * tx / 2}px ${-Math.floor(Math.random() * 14) * tx / 2}px`;
    if (teile.length > 120) teile.shift().el.remove();
    fx.appendChild(el);
    teile.push({ el, x: m.x + zufall(-m.g * .4, m.g * .4), y: m.y + zufall(-m.g * .4, m.g * .3),
      vx: zufall(-kraft, kraft), vy: zufall(-kraft * 1.4, -kraft * .2), leben: zufall(.5, .9) });
  }
}
let letzteZeit = performance.now();
function schleife(t) {
  const dt = Math.min(.05, (t - letzteZeit) / 1000); letzteZeit = t;
  const schwer = window.innerHeight * 2.2;
  for (let i = teile.length - 1; i >= 0; i--) {
    const p = teile[i];
    p.vy += schwer * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.leben -= dt;
    p.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
    if (p.leben <= 0) { p.el.remove(); teile.splice(i, 1); }
  }
  feuerwerkSchritt(dt);
  requestAnimationFrame(schleife);
}
requestAnimationFrame(schleife);

// ---------- Item-Grafik ----------
const blockIcons = {};
function blockIcon(src) {
  if (blockIcons[src]) return blockIcons[src];
  const c = document.createElement("canvas");
  c.width = c.height = 64;
  const x = c.getContext("2d");
  x.imageSmoothingEnabled = false;
  const img = new Image();
  const p = new Promise((ok) => {
    img.onload = () => {
      const flaeche = (m, dunkel) => {
        x.setTransform(...m); x.globalCompositeOperation = "source-over"; x.drawImage(img, 0, 0, 16, 16);
        if (dunkel) { x.globalCompositeOperation = "source-atop"; x.fillStyle = `rgba(0,0,0,${dunkel})`; x.fillRect(0, 0, 16, 16); }
      };
      flaeche([2, 1, -2, 1, 32, 0], 0);
      flaeche([2, 1, 0, 2, 0, 16], .25);
      flaeche([2, -1, 0, 2, 32, 32], .45);
      ok(c.toDataURL());
    };
  });
  img.src = src;
  blockIcons[src] = p;
  return p;
}
async function itemBild(el, key) {
  const it = ITEMS[key];
  const url = it.block ? await blockIcon(it.block) : it.bild;
  el.style.backgroundImage = `url(${url})`;
  el.style.setProperty("--m", `url(${url})`);
  el.classList.toggle("ench", !!it.ench);
}

  const el = document.createElement("div");
  el.className = "flug item";
  const g = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--p")) * 16;
  el.style.width = el.style.height = g * 1.4 + "px";
  itemBild(el, def.drop);
  fx.appendChild(el);
  const start = { x: m.x - g * .7, y: m.y - g * .7 };
  const sprung = { x: start.x + zufall(-m.g * .3, m.g * .3), y: start.y - m.g * .35 };
  el.animate([
    { transform: `translate(${start.x}px, ${start.y}px) scale(.3)` },
    { transform: `translate(${sprung.x}px, ${sprung.y}px) scale(1) rotate(-10deg)`, offset: .45, easing: "ease-in" },
    { transform: `translate(${sprung.x}px, ${sprung.y + m.g * .05}px) scale(1)`, offset: .62, easing: "ease-in" },
    { transform: `translate(${ziel.getBoundingClientRect().left - g * .2}px, ${ziel.getBoundingClientRect().top - g * .2}px) scale(.7)` },
  ], { duration: 950, easing: "ease-out", fill: "forwards" });
  // Timer statt onfinish, damit das Item auch bei gedrosselten Animationen ankommt
  setTimeout(() => {
    el.remove();
    slotsZeichnen();
    ziel.classList.remove("hupf"); void ziel.offsetWidth; ziel.classList.add("hupf");
    ton("pop", .45, zufall(1.4, 2));
  }, 960);
}

// ---------- Hand ----------
async function handZeigen() {
  const hand = $("#hand"), s = zustand.inv[zustand.auswahl];
  if (!s) { hand.style.display = "none"; return; }
  const it = ITEMS[s.key];
  const url = it.block ? await blockIcon(it.block) : it.bild;
  if (zustand.inv[zustand.auswahl] !== s) return;
  hand.style.display = "block";
  hand.style.backgroundImage = `url(${url})`;
  hand.classList.toggle("blockhand", !!it.block);
}

// ---------- Inventar ----------
const invGui = $("#invgui");
const invSlots = [];
function invSlotPos(i) {
  if (i < 9) return [8 + i * 18, 142];
  if (i < 36) return [8 + ((i - 9) % 9) * 18, 84 + Math.floor((i - 9) / 9) * 18];
  if (i < 40) return [8, 8 + (i - 36) * 18];
  return [77, 62];
}
const LEER_BILD = { 36: "slot_helmet", 37: "slot_chestplate", 38: "slot_leggings", 39: "slot_boots", 40: "slot_shield" };
for (let i = 0; i < INV_GROESSE; i++) {
  const [x, y] = invSlotPos(i);
  const el = document.createElement("div");
  el.className = "islot";
  el.style.left = `calc(${x} * var(--p))`;
  el.style.top = `calc(${y} * var(--p))`;
  el.innerHTML = (LEER_BILD[i] ? `<img class="leer" src="${T}gui/${LEER_BILD[i]}.png" alt="">` : "") + `<div class="item"></div><div class="anzahl t"></div>`;
  el.addEventListener("pointerenter", (e) => e.pointerType === "mouse" && invTooltip(i));
  el.addEventListener("pointerleave", (e) => e.pointerType === "mouse" && zustand.gewaehlt == null && tooltipWeg());
  el.addEventListener("pointerdown", (e) => { e.stopPropagation(); invTippen(i); });
  invGui.appendChild(el);
  invSlots.push(el);
}
zustand.gewaehlt = null;
function invZeichnen() {
  invSlots.forEach((el, i) => {
    slotFuellen(el, i);
    el.classList.toggle("gewaehlt", zustand.gewaehlt === i);
    const leer = el.querySelector(".leer");
    if (leer) leer.style.display = zustand.inv[i] ? "none" : "block";
  });
}
function invTooltip(i) {
  const s = zustand.inv[i];
  if (!s) { tooltipWeg(); return; }
  tooltip.innerHTML = itemTooltip(s.key);
  tooltip.style.display = "block";
  const r = invSlots[i].getBoundingClientRect(), t = tooltip.getBoundingClientRect();
  let x = r.right + 6;
  if (x + t.width > innerWidth - 6) x = Math.max(6, r.left + r.width / 2 - t.width / 2);
  x = Math.min(x, innerWidth - t.width - 6);
  let y = r.top - t.height - 6;
  if (y < 6) y = Math.min(r.bottom + 6, innerHeight - t.height - 6);
  tooltip.style.left = x + "px";
  tooltip.style.top = Math.max(6, y) + "px";
}
// Antippen: Item aufnehmen, nochmal woanders antippen: ablegen oder tauschen
function invTippen(i) {
  ton("click", .25, 1.4);
  const inv = zustand.inv, g = zustand.gewaehlt, s = inv[i];
  if (g == null) {
    if (!s) { tooltipWeg(); return; }
    if (s.key === "gutschein") { inventarZu(); enthuellen(); return; }
    invTooltip(i);
    if (ITEMS[s.key].fest) return;
    zustand.gewaehlt = i;
  } else {
    tooltipWeg();
    zustand.gewaehlt = null;
    const quelle = inv[g];
    const erlaubt = !(s && ITEMS[s.key].fest) && !(i >= 36 && i < 40);
    if (i !== g && erlaubt) {
      if (s && s.key === quelle.key) { s.n += quelle.n; inv[g] = null; }
      else { inv[i] = quelle; inv[g] = s; }
      ton("pop", .3, 1.6);
    }
  }
  invZeichnen();
  slotsZeichnen();
}
function inventarAuf() {
  if (!zustand.aktiv && !zustand.fertig) return;
  tooltipWeg();
  zustand.gewaehlt = null;
  invZeichnen();
  $("#invkoerper").src = `https://mc-heads.net/body/${encodeURIComponent(zustand.name)}/100`;
  $("#inventar").classList.add("on");
  ton("click", .3, 1);
}
function inventarZu() {
  zustand.gewaehlt = null;
  tooltipWeg();
  $("#inventar").classList.remove("on");
  slotsZeichnen();
}
$("#inventar").addEventListener("pointerdown", (e) => { if (e.target.id === "inventar" || e.target.id === "invzu") inventarZu(); });

// ---------- Tastatur und Mausrad ----------
addEventListener("keydown", (e) => {
  if (!$("#spiel").classList.contains("on") || $("#enthuellung").classList.contains("on")) return;
  if (e.key >= "1" && e.key <= "9") auswaehlen(+e.key - 1, true);
  else if (e.key.toLowerCase() === "e") $("#inventar").classList.contains("on") ? inventarZu() : inventarAuf();
  else if (e.key === "Escape") inventarZu();
});
addEventListener("wheel", (e) => {
  if (!$("#spiel").classList.contains("on") || $("#inventar").classList.contains("on")) return;
  auswaehlen((zustand.auswahl + (e.deltaY > 0 ? 1 : 8)) % 9, true);
}, { passive: true });

// ---------- Feuerwerk ----------
const fw = $("#feuerwerk"), fwc = fw.getContext("2d");
let funken = [];
const FW_FARBEN = ["#FF5555", "#FFAA00", "#FFFF55", "#55FF55", "#55FFFF", "#5555FF", "#FF55FF", "#FFFFFF"];
function feuerwerk(anzahl) {
  fw.width = innerWidth; fw.height = innerHeight;
  for (let k = 0; k < anzahl; k++) {
    setTimeout(() => {
      ton("launch", .5, zufall(.9, 1.1));
      setTimeout(() => {
        const x = zufall(.15, .85) * innerWidth, y = zufall(.12, .45) * innerHeight;
        const f1 = FW_FARBEN[Math.floor(Math.random() * FW_FARBEN.length)];
        const f2 = FW_FARBEN[Math.floor(Math.random() * FW_FARBEN.length)];
        for (let i = 0; i < 70; i++) {
          const w = Math.random() * Math.PI * 2, v = zufall(80, 260);
          funken.push({ x, y, vx: Math.cos(w) * v, vy: Math.sin(w) * v, leben: zufall(1, 1.8), farbe: i % 2 ? f1 : f2 });
        }
        ton("blast", .6, zufall(.9, 1.1));
        setTimeout(() => ton("twinkle", .4, zufall(.9, 1.1)), 600);
      }, 450);
    }, k * 550);
  }
}
function feuerwerkSchritt(dt) {
  if (!funken.length) return;
  fwc.clearRect(0, 0, fw.width, fw.height);
  const g = Math.max(2, parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--p")) * 1.5);
  for (let i = funken.length - 1; i >= 0; i--) {
    const f = funken[i];
    f.vx *= .985; f.vy = f.vy * .985 + 120 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.leben -= dt;
    if (f.leben <= 0) { funken.splice(i, 1); continue; }
    fwc.globalAlpha = Math.min(1, f.leben * 1.5) * (Math.random() < .15 ? .3 : 1);
    fwc.fillStyle = f.farbe;
    fwc.fillRect(Math.round(f.x), Math.round(f.y), g, g);
  }
  if (!funken.length) fwc.clearRect(0, 0, fw.width, fw.height);
}

// ---------- Anmeldung ----------
const zeige = (id) => document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id));

async function beitreten() {
  audioStart();
  ton("click", .4);
  const name = $("#name").value.trim();
  $("#namefehler").innerHTML = "";
  if (!/^[A-Za-z0-9_]{3,16}$/.test(name)) {

    return;
  }
  if (!window.crypto || !crypto.subtle) {
    $("#namefehler").innerHTML = mc("§cDiese Seite muss über https geöffnet werden.");
    return;
  }
  zeige("verbinden");
  $("#kopf").style.display = "none";

  if (ergebnis.status === "fulfilled") geschenk = ergebnis.value;
  if (!geschenk) { zeige("abgelehnt"); return; }

  zustand.name = geschenk.name || name;
  zustand.geschenk = geschenk;
  const kopf = $("#kopf");
  kopf.onload = () => (kopf.style.display = "block");
  kopf.src = `https://mc-heads.net/avatar/${encodeURIComponent(zustand.name)}/64`;
  $("#verbtext").innerHTML = mc("§7Melde an …");
  $("#ladebalken").style.width = "45%";
  await warte(800);
  $("#verbtext").innerHTML = mc(`§aWillkommen, §f${zustand.name}§a!`);
  $("#ladebalken").style.width = "80%";
  await warte(900);
  $("#verbtext").innerHTML = mc("§7Lade Terrain …");
  $("#ladebalken").style.width = "100%";
  await warte(700);
  spielStart();
}

$("#name").addEventListener("keydown", (e) => e.key === "Enter" && beitreten());
